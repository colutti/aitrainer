services:
  firebase-emulator:
    image: docker.io/library/node:22-slim
    working_dir: /workspace
    dns:
      - ${TEST_DNS_PRIMARY:-1.1.1.1}
      - ${TEST_DNS_SECONDARY:-8.8.8.8}
    volumes:
      - ../:/workspace
      - firebase_emulator_npm_cache:/root/.npm
    environment:
      NPM_CONFIG_FETCH_RETRIES: ${NPM_CONFIG_FETCH_RETRIES:-5}
      NPM_CONFIG_FETCH_RETRY_MINTIMEOUT: ${NPM_CONFIG_FETCH_RETRY_MINTIMEOUT:-2000}
      NPM_CONFIG_FETCH_RETRY_MAXTIMEOUT: ${NPM_CONFIG_FETCH_RETRY_MAXTIMEOUT:-20000}
      NPM_CONFIG_FETCH_TIMEOUT: ${NPM_CONFIG_FETCH_TIMEOUT:-120000}
      NPM_CONFIG_REGISTRY: ${NPM_CONFIG_REGISTRY:-https://registry.npmmirror.com/}
      NPM_CI_REGISTRY_FALLBACKS: ${NPM_CI_REGISTRY_FALLBACKS:-https://registry.npmmirror.com/,https://registry.npmjs.org/}
    command: >
      sh -lc "npm install -g firebase-tools@14.26.0 &&
      firebase emulators:start --project demo-fityq --only auth --config /workspace/firebase.emulator.json"
    healthcheck:
      test: ["CMD", "node", "/workspace/scripts/test/firebase_auth_emulator_healthcheck.cjs"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 20s
    networks:
      - app-network

  backend:
    build:
      context: ../backend
    working_dir: /workspace/backend
    volumes:
      - ../:/workspace
    env_file:
      - ../backend/.env.test
    environment:
      PYTHONPATH: /workspace/backend
      MONGO_URI: mongodb://aitrainer:aitrainerpass@mongo:27017/aitrainer_test?authSource=admin
      DB_NAME: aitrainer_test
      QDRANT_HOST: qdrant
      QDRANT_PORT: "6333"
      QDRANT_COLLECTION_NAME: aitrainer_test
      RUNNING_IN_CONTAINER: "true"
      STRIPE_API_BASE: ${STRIPE_API_BASE:-http://stripe-mock:12111}
      STRIPE_API_KEY: ${STRIPE_API_KEY:-sk_test_mock}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-whsec_mock}
      STRIPE_LIVE_TEST_ENABLED: ${STRIPE_LIVE_TEST_ENABLED:-false}
      STRIPE_TEST_SECRET_KEY: ${STRIPE_TEST_SECRET_KEY:-}
      STRIPE_TEST_WEBHOOK_SECRET: ${STRIPE_TEST_WEBHOOK_SECRET:-}
      STRIPE_CLI_WEBHOOK_FORWARD_URL: ${STRIPE_CLI_WEBHOOK_FORWARD_URL:-}
      FIREBASE_AUTH_EMULATOR_HOST: firebase-emulator:9099
      FIREBASE_PROJECT_ID: demo-fityq
    command: >
      sh -lc "/workspace/scripts/verify/with-resolved-services.sh
      python -m uvicorn src.api.main:app --host 0.0.0.0 --port 8000"
    depends_on:
      mongo:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      stripe-mock:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "/workspace/scripts/test/backend_healthcheck.py"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - app-network

  frontend:
    image: docker.io/library/node:22-slim
    working_dir: /workspace/frontend
    dns:
      - ${TEST_DNS_PRIMARY:-1.1.1.1}
      - ${TEST_DNS_SECONDARY:-8.8.8.8}
    volumes:
      - ../:/workspace
      - frontend_e2e_node_modules:/workspace/frontend/node_modules
      - frontend_e2e_npm_cache:/root/.npm
    environment:
      NPM_CONFIG_FETCH_RETRIES: ${NPM_CONFIG_FETCH_RETRIES:-5}
      NPM_CONFIG_FETCH_RETRY_MINTIMEOUT: ${NPM_CONFIG_FETCH_RETRY_MINTIMEOUT:-2000}
      NPM_CONFIG_FETCH_RETRY_MAXTIMEOUT: ${NPM_CONFIG_FETCH_RETRY_MAXTIMEOUT:-20000}
      NPM_CONFIG_FETCH_TIMEOUT: ${NPM_CONFIG_FETCH_TIMEOUT:-120000}
      NPM_CONFIG_REGISTRY: ${NPM_CONFIG_REGISTRY:-https://registry.npmmirror.com/}
      NPM_CI_REGISTRY_FALLBACKS: ${NPM_CI_REGISTRY_FALLBACKS:-https://registry.npmmirror.com/,https://registry.npmjs.org/}
      NPM_CI_TIMEOUT_SECONDS: ${NPM_CI_TIMEOUT_SECONDS:-420}
      NPM_CI_MAX_RETRIES: ${NPM_CI_MAX_RETRIES:-3}
      VITE_API_PROXY_TARGET: http://backend:8000
      VITE_FIREBASE_API_KEY: demo-api-key
      VITE_FIREBASE_AUTH_DOMAIN: demo-fityq.firebaseapp.com
      VITE_FIREBASE_PROJECT_ID: demo-fityq
      VITE_FIREBASE_STORAGE_BUCKET: demo-fityq.appspot.com
      VITE_FIREBASE_MESSAGING_SENDER_ID: "1234567890"
      VITE_FIREBASE_APP_ID: 1:1234567890:web:demofityq123
      VITE_USE_FIREBASE_AUTH_EMULATOR: "true"
      VITE_FIREBASE_AUTH_EMULATOR_URL: http://firebase-emulator:9099
    command: >
      sh -lc "/workspace/scripts/verify/npm-install-if-needed.sh /workspace/frontend &&
      npm run dev -- --host 0.0.0.0 --port 3000"
    depends_on:
      backend:
        condition: service_healthy
      firebase-emulator:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "/workspace/scripts/test/frontend_healthcheck.cjs"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - app-network

  playwright:
    image: mcr.microsoft.com/playwright:v1.58.1-jammy
    working_dir: /workspace/frontend
    shm_size: 1gb
    dns:
      - ${TEST_DNS_PRIMARY:-1.1.1.1}
      - ${TEST_DNS_SECONDARY:-8.8.8.8}
    volumes:
      - ../:/workspace
      - frontend_playwright_node_modules:/workspace/frontend/node_modules
      - frontend_playwright_npm_cache:/root/.npm
    environment:
      NPM_CONFIG_FETCH_RETRIES: ${NPM_CONFIG_FETCH_RETRIES:-5}
      NPM_CONFIG_FETCH_RETRY_MINTIMEOUT: ${NPM_CONFIG_FETCH_RETRY_MINTIMEOUT:-2000}
      NPM_CONFIG_FETCH_RETRY_MAXTIMEOUT: ${NPM_CONFIG_FETCH_RETRY_MAXTIMEOUT:-20000}
      NPM_CONFIG_FETCH_TIMEOUT: ${NPM_CONFIG_FETCH_TIMEOUT:-120000}
      NPM_CONFIG_REGISTRY: ${NPM_CONFIG_REGISTRY:-https://registry.npmmirror.com/}
      NPM_CI_REGISTRY_FALLBACKS: ${NPM_CI_REGISTRY_FALLBACKS:-https://registry.npmmirror.com/,https://registry.npmjs.org/}
      NPM_CI_TIMEOUT_SECONDS: ${NPM_CI_TIMEOUT_SECONDS:-420}
      NPM_CI_MAX_RETRIES: ${NPM_CI_MAX_RETRIES:-3}
      PLAYWRIGHT_BASE_URL: http://frontend:3000
      E2E_API_BASE_URL: http://backend:8000
      PLAYWRIGHT_SKIP_WEB_SERVER: "1"
      VITE_E2E_USER_EMAIL: bot-real@fityq.it
      E2E_STRIPE_LIVE_TEST_ENABLED: ${STRIPE_LIVE_TEST_ENABLED:-false}
      E2E_STRIPE_TEST_SECRET_KEY: ${STRIPE_TEST_SECRET_KEY:-}
      E2E_STRIPE_TEST_WEBHOOK_SECRET: ${STRIPE_TEST_WEBHOOK_SECRET:-}
      E2E_FIREBASE_AUTH_EMULATOR_URL: http://firebase-emulator:9099
      E2E_FIREBASE_PROJECT_ID: demo-fityq
      E2E_FIREBASE_API_KEY: demo-api-key
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
      firebase-emulator:
        condition: service_healthy
    command: >
      sh -lc "/workspace/scripts/verify/npm-install-if-needed.sh /workspace/frontend &&
      npx playwright test --reporter=list"
    networks:
      - app-network

volumes:
  firebase_emulator_npm_cache:
  frontend_e2e_node_modules:
  frontend_e2e_npm_cache:
  frontend_playwright_node_modules:
  frontend_playwright_npm_cache:
